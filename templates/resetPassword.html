<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Reset password</title>
    <style>
      body {
        width: 100%;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 8px;
        padding: 20px;
      }
      .header {
        width: 200px;
        height: 100px;
        border-radius: 6px;
        margin: 20px auto; /* Centers the header at the top */
        text-align: center; /* Centers the content inside the header */
      }
      .header img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .content h3 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
        padding-bottom: 10px;
      }
      .content p {
        font-size: 18px;
        font-weight: 400;
        line-height: 24px;
        margin: 10px 0;
      }
      .button-container {
        margin: 40px 0;
        text-align: center;
      }
      .button-container a {
        padding: 16px 20px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 6px;
        text-decoration: none;
        background-color: #000;
        color: #ffffff;
        cursor: pointer;
      }
      .footer-link {
        margin-top: 30px;
        padding-top: 10px;
        border-top: 1px solid rgba(128, 128, 128, 0.739);
        color: #666;
      }
      .footer-link p {
        margin: 10px 0;
        font-size: 16px;
        line-height: 24px;
      }
      .footer {
        margin-top: 30px;
        padding-top: 10px;
        border-top: 1px solid rgba(128, 128, 128, 0.739);
        color: #666;
        text-align: center;

      }

    <div class="container">

      </div>
      <div class="footer-link">
        <p>click the link below to reset your password:</p>
        <p>{{ verification_link }}</p>
      </div>

      <div class="footer">
        <p>©2026 Finfrevia, All rights reserved.</p>
      </div>
    </div>
